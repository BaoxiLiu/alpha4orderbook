# Port of cryptocurrency_quant "已有九特征" · microprice_offset_bp
# Source: app/backtesting/research/FACTOR_CATALOG.md
#         app/backtesting/feature_cache.py FeatureStore.lookup
# Formula: ((bid*ask_sz + ask*bid_sz)/(bid_sz+ask_sz) − mid)/mid × 10000
factor:
  name: microprice_offset_bp
  version: "0.1.0"
  frequency: 1s
  description: >
    Microprice deviation from mid in basis points (catalog microprice_offset_bp).

  output:
    - col: microprice_offset_bp
      dtype: float64

  requires:
    panel: [best_bid, best_ask, best_bid_sz, best_ask_sz, mid]

  steps:
    - id: microprice_offset_bp
      op: microprice_offset_bp
      params: { out: microprice_offset_bp }
      outputs: [microprice_offset_bp]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: microprice_offset_bp
    splits:
      method: time
      fractions: [0.6, 0.2, 0.2]
