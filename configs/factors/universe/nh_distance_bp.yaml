# Universe Spec — nh_distance_bp
# Sources: nh_value:distance_bp
factor:
  name: nh_distance_bp
  version: "0.3.0"
  frequency: 1s
  description: >
    NH port via trades_features.parquet (nh_value:distance_bp)

  output:
    - col: nh_distance_bp
      dtype: float64

  requires:
    panel: [ts_ms, mid, best_bid, best_ask, best_bid_sz, best_ask_sz, nh_distance_bp]

  steps:
    - id: nh_distance_bp
      op: from_column
      params: { col: nh_distance_bp, out: nh_distance_bp }
      outputs: [nh_distance_bp]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: nh_distance_bp
