# Universe Spec — hour_cos
# Sources: v3:E11
factor:
  name: hour_cos
  version: "0.2.0"
  frequency: 1s
  description: >
    UTC hour cos

  output:
    - col: hour_cos
      dtype: float64

  requires:
    panel: [ts_ms]

  steps:
    - id: hour_cos
      op: hour_cycle
      params: { component: cos, out: hour_cos }
      outputs: [hour_cos]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: hour_cos
