# Universe Spec — nh_spread_bp
# Sources: nh_value:spread_bp
factor:
  name: nh_spread_bp
  version: "0.3.0"
  frequency: 1s
  description: >
    NH port via trades_features.parquet (nh_value:spread_bp)

  output:
    - col: nh_spread_bp
      dtype: float64

  requires:
    panel: [ts_ms, mid, best_bid, best_ask, best_bid_sz, best_ask_sz, nh_spread_bp]

  steps:
    - id: nh_spread_bp
      op: from_column
      params: { col: nh_spread_bp, out: nh_spread_bp }
      outputs: [nh_spread_bp]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: nh_spread_bp
