# Universe Spec — spread_dev_1h
# Sources: v3:A8
factor:
  name: spread_dev_1h
  version: "0.2.0"
  frequency: 1s
  description: >
    spread_bp − rolling median 1h

  output:
    - col: spread_dev_1h
      dtype: float64

  requires:
    panel: [mid, spread, best_bid, best_ask, best_bid_sz, best_ask_sz]

  steps:
    - id: spread_dev_1h
      op: spread_dev
      params: { window: 3600, out: spread_dev_1h }
      outputs: [spread_dev_1h]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: spread_dev_1h
