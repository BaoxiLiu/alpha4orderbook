# Universe Spec — microprice_mom_10s
# Sources: v3:D13
factor:
  name: microprice_mom_10s
  version: "0.2.0"
  frequency: 1s
  description: >
    Microprice spread-frac Δ10s

  output:
    - col: microprice_mom_10s
      dtype: float64

  requires:
    panel: [mid, spread, best_bid, best_ask, best_bid_sz, best_ask_sz]

  steps:
    - id: microprice_mom_10s
      op: microprice_mom
      params: { lag: 10, out: microprice_mom_10s }
      outputs: [microprice_mom_10s]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: microprice_mom_10s
