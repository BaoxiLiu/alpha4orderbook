# Universe Spec — gh_trade_vs_depth
# Sources: github_survey:gh_trade_vs_depth
factor:
  name: gh_trade_vs_depth
  version: "0.4.0"
  frequency: 1s
  description: >
    nh_ti_1s / log1p(touch depth) — trades×book

  output:
    - col: gh_trade_vs_depth
      dtype: float64

  requires:
    panel: [mid, spread, best_bid, best_ask, best_bid_sz, best_ask_sz, nh_ti_1s, nh_signed_volume1]

  steps:
    - id: gh_trade_vs_depth
      op: trade_vs_depth
      params: { out: 'gh_trade_vs_depth' }
      outputs: [gh_trade_vs_depth]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: gh_trade_vs_depth
