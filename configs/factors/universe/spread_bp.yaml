# Universe Spec — spread_bp
# Catalog spread_bp
factor:
  name: spread_bp
  version: "0.1.0"
  frequency: 1s
  description: >
    Catalog spread_bp

  output:
    - col: spread_bp
      dtype: float64

  requires:
    panel: [mid, spread, best_bid, best_ask]

  steps:
    - id: spread_bp
      op: spread_bp
      params: { out: spread_bp }
      outputs: [spread_bp]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: spread_bp
