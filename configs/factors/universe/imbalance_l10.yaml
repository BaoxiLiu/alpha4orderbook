# Universe Spec — imbalance_l10
# Top-10 depth imbalance
factor:
  name: imbalance_l10
  version: "0.1.0"
  frequency: 1s
  description: >
    Top-10 depth imbalance

  output:
    - col: imbalance_l10
      dtype: float64

  requires:
    panel: [bid_sz_0, bid_sz_1, bid_sz_2, bid_sz_3, bid_sz_4, bid_sz_5, bid_sz_6, bid_sz_7, bid_sz_8, bid_sz_9, ask_sz_0, ask_sz_1, ask_sz_2, ask_sz_3, ask_sz_4, ask_sz_5, ask_sz_6, ask_sz_7, ask_sz_8, ask_sz_9]

  steps:
    - id: imbalance_l10
      op: imbalance_levels
      params: { levels: 10, out: imbalance_l10 }
      outputs: [imbalance_l10]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: imbalance_l10
