# Universe Spec — nh_rv1
# Sources: nh_value:rv1
factor:
  name: nh_rv1
  version: "0.3.0"
  frequency: 1s
  description: >
    NH port via trades_features.parquet (nh_value:rv1)

  output:
    - col: nh_rv1
      dtype: float64

  requires:
    panel: [ts_ms, mid, best_bid, best_ask, best_bid_sz, best_ask_sz, nh_rv1]

  steps:
    - id: nh_rv1
      op: from_column
      params: { col: nh_rv1, out: nh_rv1 }
      outputs: [nh_rv1]

  labels:
    price: mid
    horizons_seconds: [1, 5, 10, 30, 60, 300]

  eval:
    metrics: [rank_ic, coverage, ic_decay]
    primary_factor: nh_rv1
